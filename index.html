<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shree raam weds Gayathri · 22.11.2026</title>
  <meta name="description" content="Wedding invitation of Er. K.R. Shree raam and Dr. M. Gayathri — choose English or Tamil.">
  <meta name="theme-color" content="#3d0710">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arima:wght@700&family=Cinzel:wght@600&family=Cormorant+Garamond:ital@1&family=Great+Vibes&family=Noto+Serif+Tamil:wght@600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; text-align: center;
      background: radial-gradient(circle, rgba(234,196,107,.09) 1.1px, transparent 1.6px) 0 0/26px 26px, radial-gradient(ellipse at 50% 35%, #8d1b25, #5a0b17 45%, #24030a); color: var(--gold-100); }
    .choose { max-width: 420px; animation: fadeUp 1.2s var(--ease-lux) both; }
    .choose img { width: 140px; height: auto; margin: 0 auto 10px; }
    .choose h1 { margin: 0; font-family: var(--font-script); font-weight: 400; font-size: clamp(2.6rem, 12vw, 3.6rem); line-height: 1.15;
      background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .choose .ta { font-family: var(--font-tamil-display); font-size: 1.5rem; color: var(--gold-300); margin: 4px 0 2px; }
    .choose .date { font-family: var(--font-display); letter-spacing: .3em; font-size: .85rem; margin: 0 0 30px; }
    .choose .btns { display: grid; gap: 12px; }
    .choose .btn { width: 100%; }
    .choose .btn[lang="ta"] { font-family: var(--font-tamil); letter-spacing: 0; text-transform: none; font-size: 1rem; }
    .choose small { display: block; margin-top: 22px; font-style: italic; opacity: .75; }
  </style>
</head>
<body>
  <main class="choose">
    <img src="assets/images/monogram.png" alt="S and G wedding monogram" width="480" height="500">
    <h1>Shree raam &amp; Gayathri</h1>
    <p class="ta" lang="ta">திருமண அழைப்பிதழ்</p>
    <p class="date">22 · 11 · 2026</p>
    <div class="btns">
      <a class="btn btn--gold" href="english.html" hreflang="en">Open in English</a>
      <a class="btn btn--ghost on-dark" href="tamil.html" hreflang="ta" lang="ta" style="color:var(--gold-200);box-shadow:inset 0 0 0 1.5px var(--gold-300)">தமிழில் திறக்க</a>
    </div>
    <small>Choose your language · மொழியைத் தேர்ந்தெடுக்கவும்</small>
  </main>
</body>
</html>
